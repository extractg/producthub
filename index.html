<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProductHub</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>ProductHub</h1>

    <div class="controls">

    <input

        id="searchInput"

</div>
    <div id="loading"></div>

    <div id="productContainer"></div>

    <script src="script.js"></script>

</body>
</html>
